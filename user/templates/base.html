<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title></title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="">
        <style>
            html {
                width:100%;
                height:100%;
                font-size:70%;
                padding:0;
                margin:0;
            }
            body {
                width:100%;
                height:100%;
                background-color:grey;
                color:black;
            }
            * {
                list-style:none;
                text-decoration:none;
                padding:none;
                margin:none;
                box-sizing: border-box;
            }
            header {
                padding:.8rem 2rem;
                display:flex;
                justify-content:space-between;
                align-item:center;
                position:sticky;
                width:100%;
                border-bottom: 1px solid green;
            }
            header nav {
            
            }
            nav a {
                margin-right:2.4rem;
                font-size:2rem;
                color:black;
                text-shadow:.2rem .3rem .7rem black;
                transition: color .3s;
            }
            nav a:hover {
                color:skyblue;
            }
            .active {
                border-bottom: 1px solid blue;
                padding:2rem 0 0 0;
            }
            .btn {
                background-color:green;
                color: white;
                font-size:1.2rem;
                padding:.3rem 1rem;
                text-shadow:.2rem .2rem .2rem black;
                box-shadow: .2rem .2rem .2rem black;
                cursor:pointer;
            }
            .container {
                background-color: smokewhite;
                box-shadow:.3rem .3rem .4rem gray;
                padding:1rem 2rem;
                align-item:center;
            }
        </style>
    </head>
    <body>
        <header>
            <img src='' alt='auth_logo'/>
            <nav>
                <a class='active' href ='{% url 'register' %}'>Register Page</a>
                <a href ='{% url 'login' %}'>Login Page</a>
                <a href ='{% url 'homepage' %}'>Home Page</a>
                <a href ='{% url 'logout' %}'>Logout Page</a>
            </nav>
            <button class= 'btn'> Start </button>
        </header>
        {% block content %}{% endblock  %}
    </body>
</html>
